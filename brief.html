<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Format folder</title>
<style>
:root{--bg:#fbfbfd;--card:#fff;--txt:#1d1d1f;--mut:#6e6e73;--gold:#a8823a;--link:#0066cc;--line:rgba(0,0,0,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
nav{position:sticky;top:0;z-index:5;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);background:rgba(251,251,253,.82);border-bottom:1px solid var(--line)}
nav .in{max-width:940px;margin:auto;padding:10px 22px;display:flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap}
nav .sp{flex:1}nav a.t{padding:6px 11px;border-radius:8px;color:var(--txt)}nav a.t.on{background:rgba(118,118,128,.14);font-weight:600}nav a.t:hover{text-decoration:none;background:rgba(118,118,128,.08)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
main{max-width:940px;margin:auto;padding:40px 22px 120px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}
h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:0 0 24px}h2{font-size:26px;margin:48px 0 12px;letter-spacing:-.02em;border-top:1px solid var(--line);padding-top:28px}h3{font-size:20px;margin:28px 0 8px}
blockquote{margin:16px 0;padding:12px 18px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 12px 12px 0;color:#3a3a3c;white-space:normal}
code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f0f0f3;padding:2px 6px;border-radius:6px}
pre{background:var(--card);padding:18px;border-radius:14px;overflow:auto;border:1px solid var(--line)}pre code{background:none;padding:0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0 0 28px}.meta div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}.meta span{display:block;font-size:12px;color:var(--gold);margin-bottom:4px;font-weight:600}
.err{color:#d70015}
</style></head><body>
<nav><div class="in" id="tabs"><a href="./">Format library</a><span class="sp"></span></div></nav>
<main><div class="crumb" id="crumb"></div><div id="doc">Loading…</div></main>
<script src="assets/marked.min.js"></script>
<script>
const q=new URLSearchParams(location.search).get('f')||'formats/README.md';
const ok=/^formats\/[A-Za-z0-9_.\-\/]+\.md$/.test(q)&&!q.includes('..');
const doc=document.getElementById('doc');
const dir=q.slice(0,q.lastIndexOf('/')+1);
const m=q.match(/^formats\/(\d\d-[a-z0-9-]+)\//);
if(m){const base='formats/'+m[1]+'/';const T=[['Playbook','README.md'],['Bot brief','BOT.md'],['Examples','examples/README.md'],['Stages','STAGES.md'],['Louise Carter','brands/louise-carter.md']];
  document.getElementById('tabs').insertAdjacentHTML('beforeend',T.map(([l,p])=>`<a class="t ${q===base+p?'on':''}" href="brief.html?f=${encodeURIComponent(base+p)}">${l}</a>`).join('')+`<a class="t" href="https://github.com/utopis/lc-format-visualizer/tree/main/${base}" target="_blank" rel="noopener">GitHub</a>`);
  document.getElementById('crumb').innerHTML=`<a href="brief.html?f=formats%2FFOLDERS.md">All folders</a> / ${m[1]}${q!==base+'README.md'?' / '+q.slice(base.length):''}`}
function resolve(h){const parts=(dir+h).split('/'),out=[];for(const p of parts){if(p==='..')out.pop();else if(p!=='.')out.push(p)}return out.join('/')}
if(!ok){doc.innerHTML='<p class="err">Unknown file.</p>'}else fetch(q).then(r=>{if(!r.ok)throw 0;return r.text()}).then(md=>{
  let meta='';const fm=md.match(/^---\n([\s\S]*?)\n---\n/);
  if(fm){md=md.slice(fm[0].length);const rows=fm[1].split('\n').map(l=>l.match(/^([a-z_]+):\s*(.*)$/)).filter(Boolean);
    const e=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    meta='<div class="meta">'+rows.filter(r=>!['id','name'].includes(r[1])).map(r=>'<div><span>'+e(r[1].replace(/_/g,' '))+'</span>'+e(r[2].replace(/^\[|\]$|^"|"$/g,''))+'</div>').join('')+'</div>'}
  doc.innerHTML=marked.parse(md);const h1=doc.querySelector('h1');if(meta){h1?h1.insertAdjacentHTML('afterend',meta):doc.insertAdjacentHTML('afterbegin',meta)}
  doc.querySelectorAll('script,iframe,object,embed').forEach(e=>e.remove());
  doc.querySelectorAll('[onerror],[onclick],[onload]').forEach(e=>{e.removeAttribute('onerror');e.removeAttribute('onclick');e.removeAttribute('onload')});
  doc.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
    if(/^https?:/.test(h)){a.target='_blank';a.rel='noopener'}
    else if(/^javascript:/i.test(h)){a.removeAttribute('href')}
    else if(/\.md(#.*)?$/.test(h)){const r=resolve(h.split('#')[0]);a.href=r.startsWith('formats/')?'brief.html?f='+encodeURIComponent(r):'https://github.com/utopis/lc-format-visualizer/blob/main/'+r}
    else if(!h.startsWith('#')){const r=resolve(h);a.href=r.startsWith('formats/')?'https://github.com/utopis/lc-format-visualizer/tree/main/'+r:'#'}});
  document.title=(h1?h1.textContent:q)+' · Format folder';
}).catch(()=>{doc.innerHTML='<p class="err">Could not load '+q.replace(/</g,'&lt;')+'.</p>'});
</script></body></html>
